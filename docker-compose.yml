services:
  qq-farm-bot:
    build:
      context: .
      dockerfile: core/Dockerfile
    image: qq-farm-bot:latest
    container_name: qq-farm-bot
    restart: unless-stopped

    ports:
      - "3007:3007"

    volumes:
      - ../data:/app/core/data

    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      ADMIN_PORT: "3007"
      FARM_DATA_DIR: /app/core/data

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3007/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"